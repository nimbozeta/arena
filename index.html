<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instalación Generativa · Are.na Meme</title>
    <style>
        /* --- RESET Y FULLSCREEN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        #meme-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #111;
        }

        /* --- IMAGEN DE FONDO --- */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
            opacity: 1;
            background: #222;
        }

        /* --- TEXTOS SUPERPUESTOS (ESTILO MEME) --- */
        .meme-text {
            position: absolute;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 4.5vw;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-shadow:
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000,
                0 0 10px rgba(0, 0, 0, 0.8);
            padding: 0 2%;
            z-index: 10;
            pointer-events: none;
            line-height: 1.2;
            word-break: break-word;
            transition: opacity 0.8s ease-in-out;
        }

        #top-text {
            top: 5%;
        }

        #bottom-text {
            bottom: 5%;
        }

        /* --- CONTROLES DE USUARIO (DURACIÓN) --- */
        #controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 14px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 999;
            font-family: 'Segoe UI', system-ui, sans-serif;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        #controls label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #duration-slider {
            width: 140px;
            height: 4px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #888, #fff);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #duration-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 2px solid #222;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        #duration-display {
            color: white;
            font-size: 1rem;
            font-weight: 600;
            min-width: 50px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Badge de estado */
        #status-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-family: monospace;
            font-size: 0.7rem;
            z-index: 999;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            pointer-events: none;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Mensaje de carga / error */
        #loading-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 12px;
            z-index: 1000;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .meme-text {
                font-size: 8vw;
            }
            #controls {
                bottom: 16px;
                right: 16px;
                padding: 12px 16px;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: flex-end;
                border-radius: 30px;
            }
            #duration-slider {
                width: 100px;
            }
            #status-badge {
                font-size: 0.6rem;
                top: 10px;
                right: 10px;
                padding: 4px 10px;
                white-space: normal;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- MENSAJE DE CARGA (se oculta automáticamente) -->
    <div id="loading-msg">⏳ Cargando desde Are.na...</div>

    <!-- CONTENEDOR DEL MEME -->
    <div id="meme-container">
        <img id="bg-image" src="" alt="Fondo" />
        <div id="top-text" class="meme-text">...</div>
        <div id="bottom-text" class="meme-text">...</div>
    </div>

    <!-- BADGE DE ESTADO -->
    <div id="status-badge">● Conectando a Are.na...</div>

    <!-- CONTROLES DE USUARIO -->
    <div id="controls">
        <label for="duration-slider">⏱ Duración</label>
        <input type="range" id="duration-slider" min="5" max="120" value="20" step="1" />
        <span id="duration-display">20s</span>
    </div>

    <script>
        // ===========================================================
        //  CONFIGURACIÓN - REEMPLAZA ESTOS VALORES CON LOS TUYOS
        // ===========================================================
        const ARENA_TOKEN = 'u_FYBrC3jPdI7ZUGRX9AWCzBo7-uGfEIZGJpf2itDNc'; //
        const CHANNEL_SLUG = 'mi-canal-prueba'; // <-- Ej: 'mi-canal-prueba'

        // ===========================================================
        //  ESTADO GLOBAL
        // ===========================================================
        let imageBlocks = [];      // Lista de URLs de imágenes
        let textBlocks = [];      // Lista de textos
        let isDataReady = false;
        let currentInterval = null;
        let currentDuration = 20; // segundos (se actualiza con el slider)
        let currentIndex = 0;

        // Referencias DOM
        const bgImage = document.getElementById('bg-image');
        const topText = document.getElementById('top-text');
        const bottomText = document.getElementById('bottom-text');
        const slider = document.getElementById('duration-slider');
        const display = document.getElementById('duration-display');
        const statusBadge = document.getElementById('status-badge');
        const loadingMsg = document.getElementById('loading-msg');

        // ===========================================================
        //  FUNCIÓN PARA OBTENER DATOS DE ARENA
        // ===========================================================
        async function fetchArenaData() {
            try {
                statusBadge.textContent = '⏳ Consultando API de Are.na...';
                
                // La API devuelve hasta 100 bloques por defecto. 
                // Si tu canal tiene más, añadiremos paginación más adelante (Fase 6).
                const url = `https://api.are.na/v2/channels/${CHANNEL_SLUG}?per=100`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${ARENA_TOKEN}`,
                        'Accept': 'application/json'
                    }
                });

                // Manejo de errores HTTP
                if (!response.ok) {
                    let errorMsg = `Error ${response.status}`;
                    if (response.status === 401) errorMsg = 'Token inválido o revocado. Verifica tu token.';
                    if (response.status === 404) errorMsg = `Canal "${CHANNEL_SLUG}" no encontrado.`;
                    if (response.status === 429) errorMsg = 'Demasiadas peticiones. Espera un momento.';
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                
                // Verificar que el canal tiene contenido
                if (!data.contents || data.contents.length === 0) {
                    throw new Error('El canal está vacío o no tiene bloques visibles.');
                }

                // === FILTRADO POR TIPO ===
                const rawBlocks = data.contents;
                const images = [];
                const texts = [];

                for (const block of rawBlocks) {
                    // Bloque de imagen
                    if (block.class === 'Image' && block.image && block.image.display) {
                        // Usamos 'display.url' para tamaño óptimo, o 'original.url' para máxima resolución
                        const imgUrl = block.image.display.url || block.image.original.url;
                        if (imgUrl) images.push(imgUrl);
                    }
                    
                    // Bloque de texto
                    if (block.class === 'Text' && block.content) {
                        const cleanText = block.content.trim();
                        if (cleanText.length > 0) texts.push(cleanText);
                    }
                }

                // Guardar en el estado global
                imageBlocks = images;
                textBlocks = texts;

                // Validar que haya al menos una imagen
                if (imageBlocks.length === 0) {
                    throw new Error('No se encontraron bloques de imagen en el canal.');
                }

                isDataReady = true;
                statusBadge.textContent = `✅ ${imageBlocks.length} imágenes · ${textBlocks.length} textos · Canal: ${CHANNEL_SLUG}`;
                loadingMsg.style.display = 'none';
                console.log(`📸 Imágenes cargadas: ${imageBlocks.length}`);
                console.log(`📝 Textos cargados: ${textBlocks.length}`);

            } catch (error) {
                console.error('❌ Error en fetchArenaData:', error);
                loadingMsg.innerHTML = `❌ Error: ${error.message}<br><small>Revisa token, slug o conexión.</small>`;
                statusBadge.textContent = '⚠️ Error - Revisa consola';
                // Dejamos los arrays vacíos para que el ciclo no intente usarlos
                imageBlocks = [];
                textBlocks = [];
                isDataReady = false;
            }
        }

        // ===========================================================
        //  FUNCIÓN PARA SELECCIONAR UN PAR ALEATORIO
        // ===========================================================
        function getRandomPair() {
            // Si no hay imágenes, usamos un placeholder de emergencia
            if (imageBlocks.length === 0) {
                return {
                    image: 'https://via.placeholder.com/1920x1080/222/555?text=Sin+Imagen',
                    top: 'SIN IMAGEN',
                    bottom: 'Revisa el canal de Are.na'
                };
            }

            // Seleccionar imagen aleatoria
            const imgIndex = Math.floor(Math.random() * imageBlocks.length);
            const selectedImage = imageBlocks[imgIndex];

            // Seleccionar texto aleatorio (si hay). Si no, usamos textos por defecto.
            let selectedTop = 'SIN TEXTO DISPONIBLE';
            let selectedBottom = 'Agrega bloques de texto al canal';

            if (textBlocks.length > 0) {
                const txtIndex = Math.floor(Math.random() * textBlocks.length);
                const fullText = textBlocks[txtIndex];
                
                // Dividir el texto en dos partes (opcional).
                // Como es estilo meme, partimos por el primer punto o salto de línea.
                // Si no tiene separador, usamos el texto completo en la parte superior y dejamos la inferior vacía.
                const separator = fullText.includes('. ') ? '. ' : (fullText.includes('\n') ? '\n' : null);
                if (separator) {
                    const parts = fullText.split(separator);
                    selectedTop = parts[0].trim();
                    // Si hay más de una parte, unimos el resto para la parte inferior
                    if (parts.length > 1) {
                        selectedBottom = parts.slice(1).join(separator).trim();
                    } else {
                        selectedBottom = '...';
                    }
                } else {
                    selectedTop = fullText;
                    selectedBottom = '...';
                }

                // Limitar longitud para no romper el diseño
                if (selectedTop.length > 120) selectedTop = selectedTop.slice(0, 117) + '...';
                if (selectedBottom.length > 120) selectedBottom = selectedBottom.slice(0, 117) + '...';
            }

            return {
                image: selectedImage,
                top: selectedTop.toUpperCase(),
                bottom: selectedBottom.toUpperCase()
            };
        }

        // ===========================================================
        //  FUNCIÓN PARA ACTUALIZAR UN FOTOGRAMA (con fade)
        // ===========================================================
        function updateFrame() {
            if (!isDataReady && imageBlocks.length === 0) {
                // Si los datos no están listos, reintentamos (solo una vez)
                console.warn('Datos no listos, reintentando fetch...');
                fetchArenaData().then(() => {
                    if (isDataReady) updateFrame();
                });
                return;
            }

            const pair = getRandomPair();
            
            // Efecto de fade out
            bgImage.style.opacity = '0';
            topText.style.opacity = '0';
            bottomText.style.opacity = '0';

            setTimeout(() => {
                bgImage.src = pair.image;
                topText.textContent = pair.top;
                bottomText.textContent = pair.bottom;
                
                // Fade in
                bgImage.style.opacity = '1';
                topText.style.opacity = '1';
                bottomText.style.opacity = '1';
            }, 400);
        }

        // ===========================================================
        //  INICIALIZACIÓN DEL PRIMER FOTOGRAMA
        // ===========================================================
        function setInitialFrame() {
            if (!isDataReady && imageBlocks.length === 0) {
                // Si no hay datos, mostramos mensaje de espera
                bgImage.src = 'https://via.placeholder.com/1920x1080/222/444?text=Cargando...';
                topText.textContent = 'CARGANDO...';
                bottomText.textContent = 'DESDE ARE.NA';
                return;
            }
            const pair = getRandomPair();
            bgImage.src = pair.image;
            bgImage.style.opacity = '1';
            topText.textContent = pair.top;
            topText.style.opacity = '1';
            bottomText.textContent = pair.bottom;
            bottomText.style.opacity = '1';
        }

        // ===========================================================
        //  GESTIÓN DEL CICLO (iniciar / reiniciar)
        // ===========================================================
        function startCycle(durationSeconds) {
            if (currentInterval) {
                clearInterval(currentInterval);
                currentInterval = null;
            }
            const ms = Math.max(durationSeconds * 1000, 1000);
            currentInterval = setInterval(updateFrame, ms);
            statusBadge.textContent = statusBadge.textContent.replace(/· \d+s$/, '') + ` · ${durationSeconds}s`;
        }

        // ===========================================================
        //  MANEJADOR DEL SLIDER
        // ===========================================================
        slider.addEventListener('input', function() {
            const val = parseInt(this.value, 10);
            currentDuration = val;
            display.textContent = val + 's';
            startCycle(currentDuration);
        });

        // ===========================================================
        //  ARRANQUE DE LA PIEZA (ASYNC)
        // ===========================================================
        async function init() {
            // Primero cargar datos de Are.na
            await fetchArenaData();
            
            // Poner el primer frame (con o sin datos)
            setInitialFrame();
            
            // Iniciar ciclo con la duración por defecto (20s)
            startCycle(currentDuration);
            
            console.log('✅ Fase 2 completada. Conectado a Are.na.');
        }

        // Ejecutar
        init();
    </script>
</body>
</html>
